<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер Піксель-Артів (Точна палітра)</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #4CAF50; }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }
        .section {
            background: #2b2b2b;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            flex: 1;
            min-width: 300px;
        }
        h2 { margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 10px 5px 10px 0;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .btn:hover { background-color: #45a049; }
        .btn:disabled { background-color: #555; cursor: not-allowed; }
        
        input[type="file"] { display: none; }
        
        canvas {
            background: #fff;
            max-width: 100%;
            display: block;
            margin-top: 10px;
            border: 1px solid #555;
            image-rendering: pixelated; /* Щоб пікселі не розмивалися */
        }
        
        #paletteSwatches {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 15px;
        }
        .swatch {
            width: 25px;
            height: 25px;
            border: 1px solid #000;
            cursor: pointer;
            position: relative;
        }
        .swatch:hover::after {
            content: attr(data-color);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 2px 5px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 10;
        }
        .status { font-style: italic; color: #aaa; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Конвертер Піксель-Артів у Свою Палітру</h1>
    
    <div class="container">
        <!-- Крок 1: Палітра -->
        <div class="section">
            <h2>Крок 1: Палітра</h2>
            <label class="btn" for="paletteLoader">Завантажити картинку палітри</label>
            <input type="file" id="paletteLoader" accept="image/*">
            <button class="btn" id="autoExtractBtn" disabled>Авто-збір кольорів</button>
            <p class="status" id="paletteStatus">Паліта порожня. Завантажте зображення.</p>
            <canvas id="paletteCanvas"></canvas>
            <div id="paletteSwatches"></div>
        </div>

        <!-- Крок 2: Арт -->
        <div class="section">
            <h2>Крок 2: Твій Арт</h2>
            <label class="btn" for="imageLoader">Завантажити свій арт</label>
            <input type="file" id="imageLoader" accept="image/*">
            <button class="btn" id="processBtn" disabled>Обробити (Замінити кольори)</button>
            <button class="btn" id="downloadBtn" disabled style="background-color: #2196F3;">Завантажити результат</button>
            <p class="status" id="artStatus">Арт не завантажено.</p>
            <canvas id="originalCanvas"></canvas>
            <hr style="border-color: #444; margin: 20px 0;">
            <h3>Результат:</h3>
            <canvas id="resultCanvas"></canvas>
        </div>
    </div>

    <script>
        let palette = []; // Масив для збереження кодів кольорів палітри
        let originalImageData = null;

        const paletteLoader = document.getElementById('paletteLoader');
        const paletteCanvas = document.getElementById('paletteCanvas');
        const paletteCtx = paletteCanvas.getContext('2d');
        const autoExtractBtn = document.getElementById('autoExtractBtn');
        const paletteSwatches = document.getElementById('paletteSwatches');
        const paletteStatus = document.getElementById('paletteStatus');

        const imageLoader = document.getElementById('imageLoader');
        const originalCanvas = document.getElementById('originalCanvas');
        const originalCtx = originalCanvas.getContext('2d');
        const resultCanvas = document.getElementById('resultCanvas');
        const resultCtx = resultCanvas.getContext('2d');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const artStatus = document.getElementById('artStatus');

        // --- РОБОТА З ПАЛІТРОЮ ---
        paletteLoader.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    paletteCanvas.width = img.width;
                    paletteCanvas.height = img.height;
                    paletteCtx.drawImage(img, 0, 0);
                    autoExtractBtn.disabled = false;
                    paletteStatus.innerText = "Палітру завантажено! Натисніть 'Авто-збір' або клікайте по картинці піпеткою.";
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // Автоматичний збір усіх унікальних кольорів
        autoExtractBtn.addEventListener('click', () => {
            const imgData = paletteCtx.getImageData(0, 0, paletteCanvas.width, paletteCanvas.height);
            const data = imgData.data;
            const uniqueColors = new Set();

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
                if (a < 125) continue; // Пропускаємо прозорість
                const hex = rgbToHex(r, g, b);
                uniqueColors.add(hex);
            }

            palette = Array.from(uniqueColors);
            renderPalette();
            checkProcessButton();
            paletteStatus.innerText = `Знайдено ${palette.length} унікальних кольорів.`;
        });

        // Ручний збір (піпетка)
        paletteCanvas.addEventListener('click', (e) => {
            const rect = paletteCanvas.getBoundingClientRect();
            const scaleX = paletteCanvas.width / rect.width;
            const scaleY = paletteCanvas.height / rect.height;
            const x = Math.floor((e.clientX - rect.left) * scaleX);
            const y = Math.floor((e.clientY - rect.top) * scaleY);

            const pixel = paletteCtx.getImageData(x, y, 1, 1).data;
            if (pixel[3] < 125) return; // Ігноруємо прозорість

            const hex = rgbToHex(pixel[0], pixel[1], pixel[2]);
            if (!palette.includes(hex)) {
                palette.push(hex);
                renderPalette();
                checkProcessButton();
                paletteStatus.innerText = `Додано колір: ${hex}. Усього: ${palette.length}`;
            }
        });

        function renderPalette() {
            paletteSwatches.innerHTML = '';
            palette.forEach(color => {
                const div = document.createElement('div');
                div.className = 'swatch';
                div.style.backgroundColor = color;
                div.setAttribute('data-color', color);
                div.addEventListener('click', () => {
                    palette = palette.filter(c => c !== color);
                    renderPalette();
                    checkProcessButton();
                });
                paletteSwatches.appendChild(div);
            });
        }

        // --- РОБОТА З АРТОМ ---
        imageLoader.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    originalCanvas.width = img.width;
                    originalCanvas.height = img.height;
                    originalCtx.drawImage(img, 0, 0);
                    
                    resultCanvas.width = img.width;
                    resultCanvas.height = img.height;

                    originalImageData = originalCtx.getImageData(0, 0, img.width, img.height);
                    checkProcessButton();
                    artStatus.innerText = "Арт завантажено! Натисніть 'Обробити'.";
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // Головний алгоритм обробки
        processBtn.addEventListener('click', () => {
            if (!originalImageData || palette.length === 0) return;
            
            artStatus.innerText = "Обробка... Шукаємо найближчі кольори.";
            
            setTimeout(() => {
                const newImageData = originalCtx.createImageData(originalImageData.width, originalImageData.height);
                const data = originalImageData.data;
                const newData = newImageData.data;

                const paletteRGB = palette.map(hex => hexToRgb(hex));

                for (let i = 0; i < data.length; i += 4) {
                    const r1 = data[i], g1 = data[i+1], b1 = data[i+2], a = data[i+3];

                    if (a < 125) {
                        newData[i] = 0; newData[i+1] = 0; newData[i+2] = 0; newData[i+3] = 0;
                        continue;
                    }

                    let minDistance = Infinity;
                    let closestColor = paletteRGB[0];

                    for (let j = 0; j < paletteRGB.length; j++) {
                        const pColor = paletteRGB[j];
                        const r2 = pColor.r, g2 = pColor.g, b2 = pColor.b;
                        
                        // ПОКРАЩЕНА ФОРМУЛА (Redmean) - візуально найточніший збір
                        const rmean = (r1 + r2) / 2;
                        const r = r1 - r2;
                        const g = g1 - g2;
                        const b = b1 - b2;
                        
                        const distance = Math.sqrt(
                            (((512 + rmean) * r * r) >> 8) +
                            4 * g * g +
                            (((767 - rmean) * b * b) >> 8)
                        );

                        if (distance < minDistance) {
                            minDistance = distance;
                            closestColor = pColor;
                        }
                    }

                    newData[i] = closestColor.r;
                    newData[i+1] = closestColor.g;
                    newData[i+2] = closestColor.b;
                    newData[i+3] = 255;
                }

                resultCtx.putImageData(newImageData, 0, 0);
                downloadBtn.disabled = false;
                artStatus.innerText = "Готово! Кольори підібрано максимально наближено до оригіналу.";
            }, 50);
        });

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'converted_art.png';
            link.href = resultCanvas.toDataURL();
            link.click();
        });

        // --- ДОПОМІЖНІ ФУНКЦІЇ ---
        function checkProcessButton() {
            if (originalImageData && palette.length > 0) {
                processBtn.disabled = false;
            } else {
                processBtn.disabled = true;
            }
        }

        function rgbToHex(r, g, b) {
            return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1);
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }
    </script>
</body>
</html>
